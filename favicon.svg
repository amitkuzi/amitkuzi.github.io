  <rect x="10" y="38" width="44" height="8" rx="2.5" fill="#E4632D"/>
  <rect x="17" y="26" width="30" height="8" rx="2.5" fill="#C9A227"/>
  <rect x="25" y="14" width="14" height="8" rx="2.5" fill="#C9A227" opacity=".6"/>
</svg>
