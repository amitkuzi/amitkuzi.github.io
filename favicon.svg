<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Amit Kuzi">
  <title>Amit Kuzi</title>
  <!-- Charcoal tile so the mark holds against both light and dark browser chrome.
       Two layers instead of four: at 16px the thin top bars merge into mush. -->
