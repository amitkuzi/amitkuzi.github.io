name: Sync skills and pinned repositories

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-public-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the sync scripts
        run: node --test scripts/sync-skills.test.mjs scripts/sync-pinned.test.mjs
      - name: Sync skills from amitkuzi/skills
        run: node scripts/sync-skills.mjs
      - name: Sync public GitHub profile pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync-pinned.mjs
      - name: Commit changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- index.html skills.json pinned.json; then
            echo "Skills and pins are already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html skills.json pinned.json
          git commit -m "chore: sync public skills and profile pins"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" --jq '{status: .status, url: .url}'
