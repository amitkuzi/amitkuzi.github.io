name: Sync public skills

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-public-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the sync script
        run: node --test scripts/sync-skills.test.mjs
      - name: Sync skills from amitkuzi/skills
        run: node scripts/sync-skills.mjs
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- index.html skills.json; then
            echo "Skills are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html skills.json
          git commit -m "chore: sync public skills"
          git push
