<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 42" role="img" aria-label="Amit Kuzi">
  <title>Amit Kuzi</title>
  <!-- Four deposited layers forming an "A" silhouette. Pure geometry — no text,
       no font dependency, so this file is safe to use anywhere at any size. -->
  <rect x="2"  y="30" width="44" height="6" rx="2" fill="#E4632D"/>
  <rect x="6"  y="22" width="36" height="6" rx="2" fill="#E4632D" opacity=".8"/>
  <rect x="10" y="14" width="28" height="6" rx="2" fill="#C9A227"/>
  <rect x="16" y="6"  width="16" height="6" rx="2" fill="#C9A227" opacity=".65"/>
</svg>
